<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Surprise 🎉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="card" role="main">
      <p class="tag">✨ It’s your special day ✨</p>
      <h1>Happy Birthday, <span id="friend-name">Bestie</span>!</h1>
      <p class="message">
        Wishing you a day full of sparkles, cake, and happy memories. You make life brighter and I’m so lucky to celebrate
        you today!
      </p>

      <div class="cake" aria-label="Birthday cake illustration">
        <div class="candles" id="candles">
          <span class="candle"><i class="flame"></i></span>
          <span class="candle"><i class="flame"></i></span>
          <span class="candle"><i class="flame"></i></span>
        </div>
        <div class="layer top"></div>
        <div class="layer middle"></div>
        <div class="layer bottom"></div>
      </div>

      <div class="actions">
        <button id="surprise-btn" type="button">Open Surprise 💝</button>
        <button id="blow-btn" type="button">Blow Candles 🕯️</button>
      </div>

      <p id="surprise-text" class="surprise-text" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
